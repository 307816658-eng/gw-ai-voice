<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>郭总专属 AI 配音工作台 · 云端直连门户</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .portal-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.15);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-badge {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .sub {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .jump-btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(234, 88, 12, 0.4);
      margin-bottom: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .jump-btn:active {
      transform: scale(0.98);
    }
    .cred-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 18px;
      line-height: 1.6;
      text-align: left;
    }
    .cred-title {
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cred-tag {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .copy-link-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      transition: all 0.15s;
    }
    .copy-link-btn:active {
      background: rgba(56, 189, 248, 0.25);
    }
    .status-badge.is-checking {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
    }
    .status-badge.is-checking .status-dot {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }
    .status-badge.is-offline {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(248, 113, 113, 0.35);
      color: #fca5a5;
    }
    .status-badge.is-offline .status-dot {
      background: #f87171;
      box-shadow: 0 0 8px #f87171;
      animation: none;
    }
    .tunnel-alert {
      display: none;
      background: rgba(127, 29, 29, 0.32);
      border: 1px solid rgba(248, 113, 113, 0.4);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      text-align: left;
      animation: fadeIn 0.25s ease-out;
    }
    .tunnel-alert.is-visible {
      display: block;
    }
    .tunnel-alert-msg {
      font-size: 13px;
      color: #fecaca;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .retry-btn {
      display: block;
      width: 100%;
      background: rgba(248, 113, 113, 0.22);
      border: 1px solid rgba(248, 113, 113, 0.45);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .retry-btn:active:not(:disabled) {
      transform: scale(0.98);
      background: rgba(248, 113, 113, 0.32);
    }
    .retry-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .tip-footer {
      margin-top: 18px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <div class="icon-badge">🎙️</div>
    <h1>郭总专属 AI 配音工作台</h1>
    <div class="sub">Apple Silicon M1 Pro 私有神经网络加速引擎</div>

    <div class="status-badge is-checking" id="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">正在连通 Mac 算力中枢...</span>
    </div>

    <div class="tunnel-alert" id="tunnel-alert" role="alert" aria-live="polite" hidden>
      <div class="tunnel-alert-msg" id="tunnel-alert-msg">配音服务暂时连不上（后台隧道可能过期了）。点下面按钮重试，或稍等 1 分钟后再来。</div>
      <button type="button" class="retry-btn" id="retry-btn">重试连接</button>
    </div>

    <div class="cred-box">
      <div class="cred-title">
        <span>🔐 访问凭据 (保护您的 GPU 算力)</span>
      </div>
      <div>账号：<span class="cred-tag">admin</span> （或 guowei）</div>
      <div>密码：<span class="cred-tag">888888</span></div>
    </div>

    <a href="#" id="direct-btn" class="jump-btn">🚀 立即进入配音工作台</a>
    <button class="copy-link-btn" id="copy-btn">📋 复制直连地址与访问密码</button>

    <div class="tip-footer">
      💡 <b>手机端妙招</b>：在 Safari 浏览器中点击底部的【分享】->【添加到主屏幕】，即可像真正 App 一样全屏使用！
    </div>
  </div>

  <script>
    let activeUrl = "https://grey-envelope-amounts-even.trycloudflare.com";
    let tunnelConnected = false;
    let isCheckingTunnel = false;
    let pendingEnterWorkbench = false;
    let redirectTimer = null;

    const statusBadgeEl = document.getElementById('status-badge');
    const statusTextEl = document.getElementById('status-text');
    const directBtnEl = document.getElementById('direct-btn');
    const tunnelAlertEl = document.getElementById('tunnel-alert');
    const tunnelAlertMsgEl = document.getElementById('tunnel-alert-msg');
    const retryBtnEl = document.getElementById('retry-btn');

    const DEFAULT_ERROR_MSG = "配音服务暂时连不上（后台隧道可能过期了）。点下面按钮重试，或稍等 1 分钟后再来。";

    function isValidHttpUrl(url) {
      if (typeof url !== 'string' || !url.trim()) return false;
      try {
        const parsed = new URL(url.trim());
        return parsed.protocol === 'https:' || parsed.protocol === 'http:';
      } catch (e) {
        return false;
      }
    }

    function clearRedirectTimer() {
      if (redirectTimer !== null) {
        clearTimeout(redirectTimer);
        redirectTimer = null;
      }
    }

    function setBadgeState(state, text) {
      statusBadgeEl.classList.remove('is-checking', 'is-offline');
      if (state === 'checking') statusBadgeEl.classList.add('is-checking');
      if (state === 'offline') statusBadgeEl.classList.add('is-offline');
      statusTextEl.innerText = text;
    }

    function showTunnelAlert(message) {
      tunnelAlertMsgEl.innerText = message || DEFAULT_ERROR_MSG;
      tunnelAlertEl.hidden = false;
      tunnelAlertEl.classList.add('is-visible');
    }

    function hideTunnelAlert() {
      tunnelAlertEl.hidden = true;
      tunnelAlertEl.classList.remove('is-visible');
    }

    // 动态拉取最新的工作台地址（5s 超时保护，失败回退保留当前 activeUrl）
    async function loadTunnel() {
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), 5000) : null;
      try {
        const res = await fetch('tunnel.json?t=' + Date.now(), {
          cache: 'no-store',
          signal: controller ? controller.signal : undefined
        });
        if (res && res.ok) {
          const data = await res.json();
          if (data && isValidHttpUrl(data.url)) {
            activeUrl = data.url.trim();
            return true;
          }
        }
      } catch (e) {
        console.log('Using default activeUrl:', activeUrl);
      } finally {
        if (timer !== null) clearTimeout(timer);
        directBtnEl.href = activeUrl;
      }
      return false;
    }

    // 隧道连通性自检（8s 超时，探测 activeUrl 是否可达）
    async function checkTunnel() {
      if (!isValidHttpUrl(activeUrl)) {
        tunnelConnected = false;
        clearRedirectTimer();
        setBadgeState('offline', '连接失败 · 配音地址无效');
        showTunnelAlert('配音服务地址暂时无效（后台隧道配置异常）。点下面按钮重试，或稍等 1 分钟后再来。');
        return false;
      }

      let timedOut = false;
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = controller ? setTimeout(() => {
        timedOut = true;
        controller.abort();
      }, 8000) : null;

      try {
        await fetch(activeUrl, {
          method: 'GET',
          mode: 'no-cors',
          cache: 'no-store',
          credentials: 'omit',
          signal: controller ? controller.signal : undefined
        });
        tunnelConnected = true;
        hideTunnelAlert();
        setBadgeState('online', '连接正常 · 算力中枢在线');
        return true;
      } catch (e) {
        tunnelConnected = false;
        clearRedirectTimer();
        setBadgeState('offline', '连接失败 · 配音服务暂不可用');
        if (typeof navigator !== 'undefined' && navigator.onLine === false) {
          showTunnelAlert('当前网络似乎断开了，暂时连不上配音服务。请检查网络后点下面按钮重试。');
        } else if (timedOut || (e && e.name === 'AbortError')) {
          showTunnelAlert('配音服务响应太慢（后台隧道可能过期或正在重启）。点下面按钮重试，或稍等 1 分钟后再来。');
        } else {
          showTunnelAlert(DEFAULT_ERROR_MSG);
        }
        return false;
      } finally {
        if (timer !== null) clearTimeout(timer);
      }
    }

    // 重新拉取隧道地址并自检，支持一键重试与卡住操作的自动续跑
    async function retryTunnel() {
      if (isCheckingTunnel) return false;
      isCheckingTunnel = true;
      clearRedirectTimer();

      retryBtnEl.disabled = true;
      retryBtnEl.innerText = '连接中…';
      setBadgeState('checking', '正在连通 Mac 算力中枢...');

      try {
        await loadTunnel();
        const ok = await checkTunnel();
        if (ok) {
          if (pendingEnterWorkbench) {
            pendingEnterWorkbench = false;
            setBadgeState('online', '连接正常 · 正在为您进入工作台...');
            window.location.href = activeUrl;
          } else {
            setBadgeState('online', '连接正常 · 算力中枢在线，即将自动进入...');
            // 1.5 秒后自动跳转
            redirectTimer = setTimeout(() => {
              if (tunnelConnected && !isCheckingTunnel) {
                window.location.href = activeUrl;
              }
            }, 1500);
          }
        }
        return ok;
      } catch (e) {
        tunnelConnected = false;
        setBadgeState('offline', '连接失败 · 配音服务暂不可用');
        showTunnelAlert(DEFAULT_ERROR_MSG);
        return false;
      } finally {
        isCheckingTunnel = false;
        retryBtnEl.disabled = false;
        retryBtnEl.innerText = '重试连接';
      }
    }

    retryBtnEl.addEventListener('click', () => {
      retryTunnel();
    });

    directBtnEl.addEventListener('click', (e) => {
      if (tunnelConnected && !isCheckingTunnel) {
        clearRedirectTimer();
        return;
      }
      e.preventDefault();
      pendingEnterWorkbench = true;
      if (isCheckingTunnel) {
        setBadgeState('checking', '正在确认隧道连接，连通后将自动进入...');
      } else {
        retryTunnel();
      }
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      const shareText = `🎙️ 郭总专属 AI 短视频配音工作台\n🌐 访问地址：${activeUrl}\n🔑 账号：admin\n🔒 密码：888888`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareText).then(() => {
          alert('✅ 已成功复制访问信息！您可以直接微信发给朋友。');
        }).catch(() => {
          prompt('请长按复制以下访问信息：', shareText);
        });
      } else {
        prompt('请长按复制以下访问信息：', shareText);
      }
    });

    retryTunnel();
  </script>

</body>
</html>
