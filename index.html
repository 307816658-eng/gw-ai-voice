<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>郭总专属 AI 配音工作台 · 云端直连门户</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .portal-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.15);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-badge {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .sub {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .jump-btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(234, 88, 12, 0.4);
      margin-bottom: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .jump-btn:active {
      transform: scale(0.98);
    }
    .cred-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 18px;
      line-height: 1.6;
      text-align: left;
    }
    .cred-title {
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cred-tag {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .copy-link-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      transition: all 0.15s;
    }
    .copy-link-btn:active {
      background: rgba(56, 189, 248, 0.25);
    }
    .tip-footer {
      margin-top: 18px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <div class="icon-badge">🎙️</div>
    <h1>郭总专属 AI 配音工作台</h1>
    <div class="sub">Apple Silicon M1 Pro 私有神经网络加速引擎</div>

    <div class="status-badge" id="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">正在连通 Mac 算力中枢...</span>
    </div>

    <div class="cred-box">
      <div class="cred-title">
        <span>🔐 访问凭据 (保护您的 GPU 算力)</span>
      </div>
      <div>账号：<span class="cred-tag">admin</span> （或 guowei）</div>
      <div>密码：<span class="cred-tag">888888</span></div>
    </div>

    <a href="#" id="direct-btn" class="jump-btn">🚀 立即进入配音工作台</a>
    <button class="copy-link-btn" id="copy-btn">📋 复制直连地址与访问密码</button>

    <div class="tip-footer">
      💡 <b>手机端妙招</b>：在 Safari 浏览器中点击底部的【分享】->【添加到主屏幕】，即可像真正 App 一样全屏使用！
    </div>
  </div>

  <script>
    let activeUrl = "https://grey-envelope-amounts-even.trycloudflare.com";

    // 动态拉取最新的工作台地址
    async function loadTunnel() {
      try {
        const res = await fetch('tunnel.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data && data.url) {
            activeUrl = data.url;
          }
        }
      } catch (e) {
        console.log('Using default activeUrl:', activeUrl);
      }

      document.getElementById('direct-btn').href = activeUrl;
      document.getElementById('status-text').innerText = "算力中枢在线 · 即将自动进入...";

      // 1.5 秒后自动跳转
      setTimeout(() => {
        window.location.href = activeUrl;
      }, 1500);
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
      const shareText = `🎙️ 郭总专属 AI 短视频配音工作台\n🌐 访问地址：${activeUrl}\n🔑 账号：admin\n🔒 密码：888888`;
      navigator.clipboard.writeText(shareText).then(() => {
        alert('✅ 已成功复制访问信息！您可以直接微信发给朋友。');
      }).catch(() => {
        prompt('请长按复制以下访问信息：', shareText);
      });
    });

    loadTunnel();
  </script>

</body>
</html>
